# Each region is a square box around a city centre (half_size_km on each side).
# Splits are assigned by region, never by patch, to avoid spatial leakage.
# Boxes in different splits must not overlap (checked in code and in tests).
year: 2021            # label year (ESA WorldCover 2021 v200); imagery must match
half_size_km: 12

regions:
  munich:     {name: Munich,     lat: 48.1351, lon: 11.5820, split: train}
  berlin:     {name: Berlin,     lat: 52.5200, lon: 13.4050, split: train}
  hamburg:    {name: Hamburg,    lat: 53.5511, lon: 9.9937,  split: train}
  cologne:    {name: Cologne,    lat: 50.9375, lon: 6.9603,  split: train}
  paris:      {name: Paris,      lat: 48.8566, lon: 2.3522,  split: train}
  amsterdam:  {name: Amsterdam,  lat: 52.3676, lon: 4.9041,  split: train}
  warsaw:     {name: Warsaw,     lat: 52.2297, lon: 21.0122, split: train}
  rome:       {name: Rome,       lat: 41.9028, lon: 12.4964, split: train}
  madrid:     {name: Madrid,     lat: 40.4168, lon: -3.7038, split: train}
  vienna:     {name: Vienna,     lat: 48.2082, lon: 16.3738, split: train}
  stuttgart:  {name: Stuttgart,  lat: 48.7758, lon: 9.1829,  split: val}
  lyon:       {name: Lyon,       lat: 45.7640, lon: 4.8357,  split: val}
  prague:     {name: Prague,     lat: 50.0755, lon: 14.4378, split: test}
  frankfurt:  {name: Frankfurt,  lat: 50.1109, lon: 8.6821,  split: test}
  milan:      {name: Milan,      lat: 45.4642, lon: 9.1900,  split: test_ood}
  valencia:   {name: Valencia,   lat: 39.4699, lon: -0.3763, split: test_ood}
  heidelberg: {name: Heidelberg, lat: 49.3988, lon: 8.6724,  split: case_study}

  # Rural class-focus tiles (10.24 km). Each is chosen to be dominated by one class that
  # the cities lack. Splits are fixed now, before any score is seen. The label maps decide
  # what a tile really contains, so check class shares after export and swap weak tiles.
  # Cropland
  poltava:            {name: Poltava (cropland),            lat: 49.30, lon: 33.50,  split: train, half_size_km: 5.12}
  hungarian_plain:    {name: Hungarian plain (cropland),    lat: 46.50, lon: 20.50,  split: train, half_size_km: 5.12}
  beauce:             {name: Beauce (cropland),             lat: 48.25, lon: 1.60,   split: val,   half_size_km: 5.12}
  north_china_plain:  {name: North China Plain (cropland),  lat: 37.00, lon: 115.50, split: test,  half_size_km: 5.12}
  # Trees
  black_forest:       {name: Black Forest (trees),          lat: 48.20, lon: 8.20,   split: train, half_size_km: 5.12}
  sweden_taiga:       {name: Swedish taiga (trees),         lat: 64.00, lon: 17.00,  split: val,   half_size_km: 5.12}
  appalachians:       {name: Appalachians (trees),          lat: 38.60, lon: -79.80, split: test,  half_size_km: 5.12}
  # Bare
  sahara_algeria:     {name: Algerian Sahara (bare),        lat: 26.00, lon: 4.00,   split: train, half_size_km: 5.12}
  atacama:            {name: Atacama (bare),                lat: -24.50, lon: -69.80, split: val,  half_size_km: 5.12}
  western_desert:     {name: Egyptian Western Desert (bare), lat: 27.00, lon: 29.00, split: test,  half_size_km: 5.12}
  # Shrub and grass
  dehesa_spain:       {name: Spanish dehesa (grass/shrub),  lat: 39.00, lon: -6.00,  split: train, half_size_km: 5.12}
  crete:              {name: Crete (grass/shrub),           lat: 35.20, lon: 24.90,  split: val,   half_size_km: 5.12}
  great_basin:        {name: Great Basin (grass/shrub),     lat: 40.50, lon: -117.00, split: test, half_size_km: 5.12}
  # Water
  finnish_lakeland:   {name: Finnish lakeland (water),      lat: 62.00, lon: 27.50,  split: train, half_size_km: 5.12}
  lake_balaton:       {name: Lake Balaton (water),          lat: 46.85, lon: 17.75,  split: test,  half_size_km: 5.12}

  # Southern-hemisphere and arid/steppe tiles, train only (centres taken from reference implementation C's
  # project config, coverage not yet checked: run scripts/ee_year_stats.py on them before exporting).
  # They fill two gaps: no southern-hemisphere seasons in training, and few shrub/steppe/desert tiles.
  pampas:             {name: Pampas (cropland, southern),   lat: -34.00, lon: -60.50,  split: train, half_size_km: 5.12}
  nsw_pasture:        {name: NSW pasture (grass, southern), lat: -35.10, lon: 147.40,  split: train, half_size_km: 5.12}
  kenya_savanna:      {name: Kenya savanna (grass, tropical), lat: -1.30, lon: 36.80,  split: train, half_size_km: 5.12}
  mongolia_steppe:    {name: Mongolia steppe (grass),       lat: 47.00, lon: 106.00,  split: train, half_size_km: 5.12}
  arabia_desert:      {name: Arabian desert (bare),         lat: 24.00, lon: 45.00,   split: train, half_size_km: 5.12}

  # South Africa, test_ood only (never trained on). Centres are approximate, from memory; look at each on a satellite
  # view and run scripts/ee_year_stats.py before exporting. They answer "does it work in southern Africa".
  za_freestate_maize: {name: Free State maize (cropland, South Africa), lat: -27.40, lon: 26.60, split: test_ood, half_size_km: 5.12}
  za_lowveld_savanna: {name: Lowveld savanna (trees/grass, South Africa), lat: -24.40, lon: 31.78, split: test_ood, half_size_km: 5.12}
  za_karoo_shrub:     {name: Karoo shrubland (South Africa),   lat: -32.00, lon: 22.50, split: test_ood, half_size_km: 5.12}
  za_capetown:        {name: Cape Town (city, South Africa),   lat: -33.92, lon: 18.42, split: test_ood}

  # Extra rural test sites to reach >=50 sites and widen the unseen-area coverage (test_ood only, never trained on).
  # Centres are approximate, from memory: look at EACH on a satellite view and run scripts/ee_year_stats.py before
  # exporting, then drop any that fail the coverage check (as three coherence tiles did).
  india_punjab:       {name: Punjab (irrigated cropland, India), lat: 30.90, lon: 75.80, split: test_ood, half_size_km: 5.12}
  deccan_india:       {name: Deccan plateau (crop/shrub, India), lat: 17.50, lon: 77.00, split: test_ood, half_size_km: 5.12}
  java_rice:          {name: Java (rice, tropical, Indonesia),  lat: -7.50, lon: 110.00, split: test_ood, half_size_km: 5.12}
  mekong_delta:       {name: Mekong delta (water/rice, Vietnam), lat: 10.00, lon: 105.80, split: test_ood, half_size_km: 5.12}
  amazon_para:        {name: Amazon (tropical forest, Brazil),  lat: -3.10, lon: -60.00, split: test_ood, half_size_km: 5.12}
  cerrado_brazil:     {name: Cerrado (savanna/crop, Brazil),    lat: -15.80, lon: -47.90, split: train, half_size_km: 5.12}
  canada_boreal:      {name: Boreal forest and lakes (Canada),  lat: 54.00, lon: -105.00, split: test_ood, half_size_km: 5.12}
  australia_outback:  {name: Outback (bare/shrub, Australia),   lat: -25.00, lon: 133.00, split: test_ood, half_size_km: 5.12}
  altiplano_andes:    {name: Altiplano (bare/grass, Bolivia),   lat: -16.50, lon: -68.20, split: test_ood, half_size_km: 5.12}
  sahel_niger:        {name: Sahel (bare/grass, Niger),         lat: 14.00, lon: 8.00,   split: test_ood, half_size_km: 5.12}
  iowa_maize:         {name: Iowa (maize/soy cropland, USA),    lat: 41.90, lon: -93.60, split: test_ood, half_size_km: 5.12}
  congo_forest:       {name: Congo basin (tropical forest, DRC), lat: 0.50, lon: 18.00,  split: test_ood, half_size_km: 5.12}
  patagonia_steppe:   {name: Patagonian steppe (Argentina),     lat: -45.00, lon: -70.00, split: test_ood, half_size_km: 5.12}
  nz_pasture:         {name: Canterbury pasture (New Zealand),  lat: -43.60, lon: 171.60, split: test_ood, half_size_km: 5.12}
  scottish_highlands: {name: Highlands (moor/grass, Scotland),  lat: 57.00, lon: -4.50,  split: test_ood, half_size_km: 5.12}
  iceland_tundra:     {name: Tundra and bare (Iceland),         lat: 64.50, lon: -20.00, split: test_ood, half_size_km: 5.12}
  kazakh_steppe:      {name: Kazakh steppe (grass/crop),        lat: 50.50, lon: 70.00,  split: train, half_size_km: 5.12}
  tibetan_plateau:    {name: Tibetan plateau (bare/grass),      lat: 32.00, lon: 88.00,  split: test_ood, half_size_km: 5.12}
  thai_paddy:         {name: Central plain (rice, Thailand),    lat: 15.00, lon: 100.30, split: test_ood, half_size_km: 5.12}
  ethiopia_highlands: {name: Highlands (crop/grass, Ethiopia),  lat: 9.00, lon: 39.00,   split: train, half_size_km: 5.12}
  madagascar_plateau: {name: Central plateau (Madagascar),      lat: -19.00, lon: 47.00, split: test_ood, half_size_km: 5.12}
  california_valley:  {name: Central Valley (cropland, USA),    lat: 36.50, lon: -120.00, split: test_ood, half_size_km: 5.12}
  texas_rangeland:    {name: Rangeland (shrub/grass, Texas USA), lat: 31.00, lon: -100.00, split: train, half_size_km: 5.12}
  pantanal_wetland:   {name: Pantanal (wetland/grass, Brazil),  lat: -17.50, lon: -57.00, split: test_ood, half_size_km: 5.12}
  siberia_taiga:      {name: West Siberian taiga (Russia),      lat: 60.00, lon: 90.00,  split: test_ood, half_size_km: 5.12}
  bangladesh_delta:   {name: Ganges delta (water/rice, Bangladesh), lat: 23.00, lon: 90.00, split: test_ood, half_size_km: 5.12}

# Coarse climate group per region (my assignment; correct it if you disagree). Scores are reported per group.
climate_groups:
  oceanic:       [paris, amsterdam, hamburg, cologne, frankfurt, stuttgart, lyon, heidelberg, beauce, black_forest]
  continental:   [munich, berlin, warsaw, vienna, prague, poltava, hungarian_plain, lake_balaton, appalachians, north_china_plain, mongolia_steppe]
  mediterranean: [rome, madrid, milan, valencia, dehesa_spain, crete]
  arid:          [sahara_algeria, atacama, western_desert, great_basin, arabia_desert, australia_outback, altiplano_andes, sahel_niger, tibetan_plateau, texas_rangeland]
  boreal:        [finnish_lakeland, sweden_taiga, canada_boreal, iceland_tundra, siberia_taiga]
  continental_crop: [india_punjab, deccan_india, iowa_maize, kazakh_steppe, california_valley]
  tropical:      [java_rice, mekong_delta, amazon_para, cerrado_brazil, congo_forest, thai_paddy, madagascar_plateau, pantanal_wetland, bangladesh_delta]
  southern_temperate: [patagonia_steppe, nz_pasture]
  oceanic_highland: [scottish_highlands, ethiopia_highlands]
  southern_tropical: [pampas, nsw_pasture, kenya_savanna]
  southern_africa: [za_freestate_maize, za_lowveld_savanna, za_karoo_shrub, za_capetown]
  southern_africa: [za_freestate_maize, za_lowveld_savanna, za_karoo_shrub, za_capetown]
