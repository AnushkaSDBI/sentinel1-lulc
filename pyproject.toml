[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-lulc"
version = "0.1.0"
description = "Sentinel-1-only land use / land cover segmentation with a monthly change prototype"
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["F"]
